<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Ingresando… · EcoSTAN</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f7f2; color: #1b4332; }
        .caja { text-align: center; padding: 32px; }
        .rueda { width: 36px; height: 36px; margin: 0 auto 16px; border: 4px solid #cfe3d4;
                 border-top-color: #1b4332; border-radius: 50%; animation: girar 0.9s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }
        a { color: #1b4332; }
    </style>
</head>
<body>
    <div class="caja">
        <div class="rueda" id="rueda"></div>
        <p id="mensaje">Ingresando al panel de EcoSTAN…</p>
    </div>

    <!--
      Acceso único desde https://territoriocivico.com/acceso
      Esa página inicia sesión en el mismo proyecto de Supabase y envía aquí la sesión
      en el fragmento (#), que nunca viaja al servidor. Esta página la guarda, valida los
      permisos de administrador y abre el panel.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './core/supabaseClient.js';
        import { completarAccesoAdministrativo, RUTAS } from './core/authService.js';

        const mensaje = document.getElementById('mensaje');
        const fallar = (texto) => {
            document.getElementById('rueda').style.display = 'none';
            mensaje.innerHTML = texto + '<br><br><a href="https://territoriocivico.com/acceso">Volver al acceso</a>';
        };

        const datos = new URLSearchParams(window.location.hash.slice(1));
        const access_token = datos.get('access_token');
        const refresh_token = datos.get('refresh_token');
        // Borra la sesión de la barra de direcciones y del historial
        history.replaceState(null, '', window.location.pathname);

        (async () => {
            if (!supabaseClient) return fallar('No se pudo cargar la conexión con el servidor.');
            if (!access_token || !refresh_token) return fallar('No llegó una sesión válida.');

            const { data, error } = await supabaseClient.auth.setSession({ access_token, refresh_token });
            if (error || !data || !data.user) return fallar('La sesión expiró. Vuelve a iniciar sesión.');

            const resultado = await completarAccesoAdministrativo(data.user);
            if (resultado.error) return fallar(resultado.error);

            window.location.replace(RUTAS.admin);
        })();
    </script>
</body>
</html>
